services:
  swarm-manager:
    image: docker:27-dind
    container_name: swarm-manager
    hostname: swarm-manager
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["dockerd", "--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--insecure-registry=registry:5000"]
    networks:
      dind-net:
        aliases:
          - swarm-manager
    volumes:
      - manager-data:/var/lib/docker
      - ./stack:/stack
    ports:
      - "2377:2377"   # swarm management
      - "7946:7946"   # container network discovery
      - "4789:4789/udp" # overlay network traffic
      - "8081:8081"   # published port of the fireguard-lb stack service (routing mesh)
      - "9091:9091"   # published port of the swarm-internal Prometheus (stack "monitoring")
      - "5001-5020:5001-5020" # rango de puertos para instancias individuales de postgres
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      registry:
        condition: service_started

  swarm-worker1:
    image: docker:27-dind
    container_name: swarm-worker1
    hostname: swarm-worker1
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["dockerd", "--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--insecure-registry=registry:5000"]
    networks:
      dind-net:
        aliases:
          - swarm-worker1
    volumes:
      - worker1-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      swarm-manager:
        condition: service_healthy

  swarm-worker2:
    image: docker:27-dind
    container_name: swarm-worker2
    hostname: swarm-worker2
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["dockerd", "--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--insecure-registry=registry:5000"]
    networks:
      dind-net:
        aliases:
          - swarm-worker2
    volumes:
      - worker2-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      swarm-manager:
        condition: service_healthy

  # 3er worker, agregado bajo demanda por scale-out.sh (via
  # add-swarm-worker.sh) cuando la app necesita un 5to/6to nodo y
  # swarm-worker1/2 ya estan a su capacidad "dedicada" (app3/app4).
  # No se levanta con `docker compose up -d` por defecto: solo cuando
  # add-swarm-worker.sh hace `docker compose up -d swarm-worker3`.
  swarm-worker3:
    image: docker:27-dind
    container_name: swarm-worker3
    hostname: swarm-worker3
    profiles: ["scale"]
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["dockerd", "--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--insecure-registry=registry:5000"]
    networks:
      dind-net:
        aliases:
          - swarm-worker3
    volumes:
      - worker3-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      swarm-manager:
        condition: service_healthy

  # Registro local de imágenes: cada nodo DinD tiene su propio almacén de
  # imágenes aislado, así que necesitan un registry compartido para poder
  # ejecutar en el swarm una imagen construida en el manager.
  registry:
    image: registry:2
    container_name: dind-registry
    hostname: registry
    networks:
      dind-net:
        aliases:
          - registry
    volumes:
      - registry-data:/var/lib/registry

  # --- Monitoreo de la capa host (los 4 contenedores DinD/registry vistos ---
  # --- desde el docker real de la maquina) ---------------------------------

  # cAdvisor no se puede usar aqui: este host expone su storage via el
  # snapshotter de containerd (Driver "overlayfs" + driver-type
  # "io.containerd.snapshotter.v1"), y cAdvisor (probado v0.49 y v0.52) no
  # logra registrar los contenedores Docker en ese layout ("failed to
  # identify the read-write layer ID"). En su lugar, un exportador propio
  # lee la API de stats de Docker directamente (ver monitoring/docker-stats-exporter).
  docker-stats-exporter:
    build: ./monitoring/docker-stats-exporter
    container_name: docker-stats-exporter
    hostname: docker-stats-exporter
    networks:
      - dind-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    hostname: node-exporter
    networks:
      - dind-net
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  prometheus-host:
    image: prom/prometheus:v2.55.1
    container_name: prometheus-host
    hostname: prometheus-host
    networks:
      - dind-net
    volumes:
      - ./monitoring/prometheus-host.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-host-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    hostname: grafana
    networks:
      - dind-net
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Sin :ro -- el entrypoint necesita escribir provisioning/alerting/contactpoints.yaml
      # (generado a partir de contactpoints.yaml.template) con la URL real del webhook.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    # required: false -- monitoring/.env no esta en git (tiene el webhook
    # real de Slack, ver contactpoints.yaml.template); si falta, Grafana
    # arranca igual con el contact point sin URL en vez de tumbar TODO
    # docker compose (incluidos servicios sin relacion, como los nodos DinD).
    env_file:
      - path: ./monitoring/.env
        required: false
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    entrypoint:
      - sh
      - -c
      - |
        sed -e "s|__SLACK_WEBHOOK_URL__|$$SLACK_WEBHOOK_URL|" \
          /etc/grafana/provisioning/alerting/contactpoints.yaml.template \
          > /etc/grafana/provisioning/alerting/contactpoints.yaml
        exec /run.sh
    depends_on:
      - prometheus-host

  # Optional: visualize the swarm state in a browser once it's initialized.
  # Start with: docker compose --profile viz up -d visualizer
  visualizer:
    image: dockersamples/visualizer:latest
    container_name: swarm-visualizer
    profiles: ["viz"]
    ports:
      - "8080:8080"
    environment:
      - DOCKER_HOST=tcp://swarm-manager:2375
    networks:
      - dind-net
    depends_on:
      - swarm-manager

networks:
  dind-net:
    driver: bridge

volumes:
  manager-data:
  worker1-data:
  worker2-data:
  worker3-data:
  registry-data:
  prometheus-host-data:
  grafana-data:
