# Balanceo de carga hacia los dos nodos PHP+Apache del servicio "web".
<Proxy "balancer://phpcluster">
    BalancerMember "http://web1:80" route=web1
    BalancerMember "http://web2:80" route=web2
    ProxySet lbmethod=byrequests
</Proxy>

ProxyPreserveHost On
ProxyPass "/balancer-manager" "!"
ProxyPass "/" "balancer://phpcluster/"
ProxyPassReverse "/" "balancer://phpcluster/"

<Location "/balancer-manager">
    SetHandler balancer-manager
    Require all granted
</Location>
