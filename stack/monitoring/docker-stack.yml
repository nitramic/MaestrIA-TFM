services:
  # Un node-exporter por nodo del swarm (modo global): CPU/memoria/disco/red
  # de cada nodo (swarm-manager, swarm-worker1, swarm-worker2).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks:
      - fireguard-net
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      mode: global
      restart_policy:
        condition: any

  # Un cAdvisor por nodo del swarm (modo global): CPU/memoria/disco/red por
  # contenedor/servicio corriendo en ese nodo (app1, app2, admin-worker, lb,
  # pg-directory, pg-<empresa>...).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks:
      - fireguard-net
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /:/rootfs:ro
    deploy:
      mode: global
      restart_policy:
        condition: any

  # Prometheus interno al swarm: descubre automaticamente los targets
  # (node-exporter/cadvisor/servicios de la app) via la API de Swarm.
  # Fijado al manager porque necesita su docker.sock para listar tasks.
  prometheus:
    image: prom/prometheus:v2.55.1
    user: "0:0" # necesita leer /var/run/docker.sock para el dockerswarm_sd_config
    networks:
      - fireguard-net
    configs:
      - source: prometheus-swarm-config-v2
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-swarm-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == swarm-manager]
      restart_policy:
        condition: any

configs:
  # Nota: los configs de Swarm son inmutables (solo se pueden actualizar
  # labels). Si se edita prometheus-swarm.yml hay que subir este sufijo de
  # version (ej. -v3) para que `docker stack deploy` lo recree.
  prometheus-swarm-config-v2:
    file: ./prometheus-swarm.yml

networks:
  fireguard-net:
    external: true

volumes:
  prometheus-swarm-data:
