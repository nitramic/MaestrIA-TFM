global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # node-exporter global (uno por nodo swarm): CPU/memoria/disco/red de
  # cada uno de los 3 nodos.
  - job_name: node-exporter
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: monitoring_node-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: __address__
        replacement: '${1}:9100'
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node

  # cAdvisor global (uno por nodo swarm): CPU/memoria/disco/red por
  # contenedor/servicio dentro de cada nodo (app1, app2, admin-worker, lb,
  # pg-directory, pg-<empresa>...).
  - job_name: cadvisor
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: monitoring_cadvisor
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: __address__
        replacement: '${1}:8080'
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node

  # App fireguard (app1..app5 -- escalados via scale-out.sh/scale-in.sh --
  # y admin-worker): metricas propias expuestas por server.js en /metrics
  # via prom-client (uso HTTP, logins, logins erroneos).
  - job_name: fireguard-app
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: 'fireguard_(app[1-5]|admin-worker)'
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: __address__
        replacement: '${1}:3000'
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service
