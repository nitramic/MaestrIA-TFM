# ${DIRECTORY_DB_PASSWORD}/${JWT_SECRET}/${INTERNAL_ADMIN_TOKEN} se
# interpolan con las variables de entorno presentes cuando se corre
# `docker stack deploy` (no un .env aparte) -- deploy-webapp.sh y
# scale-out.sh las cargan desde secrets.env (generate-secrets.sh) antes
# de invocarlo. Sin esas variables exportadas, el stack no arranca con
# valores validos.
services:
  app1:
    image: registry:5000/fireguard-webapp:latest
    environment: &app_env
      - DIRECTORY_DB_HOST=pg-directory
      - DIRECTORY_DB_PORT=5432
      - DIRECTORY_DB_NAME=directory
      - DIRECTORY_DB_USER=postgres
      - DIRECTORY_DB_PASSWORD=${DIRECTORY_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_ADMIN_TOKEN=${INTERNAL_ADMIN_TOKEN}
    networks:
      - fireguard-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == swarm-worker1]
      restart_policy:
        condition: any

  app2:
    image: registry:5000/fireguard-webapp:latest
    environment: *app_env
    networks:
      - fireguard-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == swarm-worker2]
      restart_policy:
        condition: any

  lb:
    image: registry:5000/fireguard-lb:latest
    networks:
      - fireguard-net
    ports:
      - "8081:80"
    configs:
      # Version inicial (app1 + app2). scale-out.sh / scale-in.sh la
      # reemplazan por una nueva version (fireguard-lb-config-v2, v3, ...)
      # cada vez que cambia el numero de nodos de app -- ver
      # stack/webapp/lb/generate-lb-conf.sh.
      - source: fireguard-lb-config-v1
        target: /usr/local/apache2/conf/extra/lb.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Privileged, internal-only provisioning worker for the /admin panel: the
  # only service with the Docker socket mounted (to create/remove per-company
  # postgres services), and never published to the host. app1/app2 reach it
  # over fireguard-net at http://admin-worker:3000, authenticated with
  # INTERNAL_ADMIN_TOKEN. Pinned to swarm-manager because that's the node
  # whose docker.sock has swarm-manager API access.
  admin-worker:
    image: registry:5000/fireguard-webapp:latest
    environment:
      - DIRECTORY_DB_HOST=pg-directory
      - DIRECTORY_DB_PORT=5432
      - DIRECTORY_DB_NAME=directory
      - DIRECTORY_DB_USER=postgres
      - DIRECTORY_DB_PASSWORD=${DIRECTORY_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_ADMIN_TOKEN=${INTERNAL_ADMIN_TOKEN}
      - DOCKER_SOCKET=/var/run/docker.sock
      - FIREGUARD_NETWORK=fireguard-net
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8081}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-FireGuard <no-reply@fireguard.local>}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fireguard-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == swarm-manager]
      restart_policy:
        condition: any

networks:
  fireguard-net:
    external: true

configs:
  fireguard-lb-config-v1:
    file: ./lb/lb.conf
