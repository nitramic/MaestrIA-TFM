# Balanceo de carga hacia los dos nodos de la app FireGuard (app1, app2).
#
# No se usa sticky session (stickysession=ROUTEID): la app no guarda estado
# de sesión en memoria del proceso. La autenticación es un JWT firmado en
# una cookie httpOnly, verificado sin estado por cualquier nodo, y el
# bloqueo por intentos fallidos de login vive en Postgres (compartido por
# ambos nodos), no en memoria local. Por eso cualquier request puede caer
# en cualquiera de los dos nodos sin romper el login ni la sesión.
# (Si en el futuro se agrega estado en memoria del proceso -p. ej. una
# cache de sesión no compartida-, activar stickysession=ROUTEID abajo,
# usando los "route=" ya definidos en cada BalancerMember.)
<Proxy "balancer://fireguardcluster">
    BalancerMember "http://app1:3000" route=app1
    BalancerMember "http://app2:3000" route=app2
    ProxySet lbmethod=byrequests
</Proxy>

ProxyPreserveHost On
ProxyPass "/balancer-manager" "!"
ProxyPass "/metrics" "!"
ProxyPass "/" "balancer://fireguardcluster/"
ProxyPassReverse "/" "balancer://fireguardcluster/"

<Location "/balancer-manager">
    SetHandler balancer-manager
    Require all granted
</Location>
